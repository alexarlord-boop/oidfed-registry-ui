version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oidfed_auth
      POSTGRES_USER: oidfed
      POSTGRES_PASSWORD: oidfed
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oidfed -d oidfed_auth"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Auth Gateway
  auth-gateway:
    build: .
    ports:
      - "9000:9000"
    environment:
      DATABASE_URL: postgresql+asyncpg://oidfed:oidfed@postgres:5432/oidfed_auth
      JWT_ISSUER: http://localhost:9000
      ADMIN_API_URL: http://host.docker.internal:8765
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      KEYCLOAK_ENABLED: ${KEYCLOAK_ENABLED:-false}
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./src/config/keys:/app/src/config/keys
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./scripts:/app/scripts
    command: >
      sh -c "
        echo 'Generating JWT keys...' &&
        python src/config/keys/generate_keys.py &&
        echo 'Running migrations...' &&
        alembic upgrade head &&
        echo 'Starting server...' &&
        uvicorn src.main:app --host 0.0.0.0 --port 9000 --reload
      "

  # Keycloak (optional)
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_URL: http://localhost:8080
      KC_HOSTNAME_ADMIN_URL: http://localhost:8080
    ports:
      - "8080:8080"
    command: start-dev
    profiles:
      - with-keycloak

volumes:
  postgres_data:
