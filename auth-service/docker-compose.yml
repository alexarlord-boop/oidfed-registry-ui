services:
  # Auth Service with SQLite (default)
  auth-service:
    build: .
    container_name: auth-service
    ports:
      - "9000:9000"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./data:/app/data  # Persist SQLite database
      - ./src/config/keys:/app/src/config/keys
      - ./scripts:/app/scripts
    environment:
      # SQLite (default)
      - DATABASE_URL=sqlite+aiosqlite:///./data/auth.db
      
      # PostgreSQL (uncomment to use, and enable postgres service below)
      # - DATABASE_URL=postgresql+asyncpg://oidfed:oidfed@postgres:5432/oidfed_auth
      
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DEBUG=true
    command: >
      sh -c "
        echo 'Generating JWT keys...' &&
        python src/config/keys/generate_keys.py &&
        echo 'Starting server (tables will be created automatically)...' &&
        uvicorn src.main:app --host 0.0.0.0 --port 9000 --reload
      "
    restart: unless-stopped
    depends_on:
      - keycloak
  
  
  # PostgreSQL Database (optional - uncomment to use instead of SQLite)
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: auth-postgres
  #   environment:
  #     POSTGRES_DB: oidfed_auth
  #     POSTGRES_USER: oidfed
  #     POSTGRES_PASSWORD: oidfed
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U oidfed -d oidfed_auth"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5
  #   restart: unless-stopped

  # Keycloak (optional - for OIDC provider testing)
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak-test
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    command: start-dev
    restart: unless-stopped

